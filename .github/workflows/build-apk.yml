name: Build UJIANKU V1.0-A
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Validate Supabase configuration
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "ERROR: GitHub Secret SUPABASE_URL belum diisi."
            exit 1
          fi
          if [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "ERROR: GitHub Secret SUPABASE_PUBLISHABLE_KEY belum diisi."
            exit 1
          fi
          case "$SUPABASE_URL" in
            https://*.supabase.co) ;;
            *)
              echo "ERROR: SUPABASE_URL harus berupa URL Supabase https://<project-ref>.supabase.co"
              exit 1
              ;;
          esac

      - name: Build Debug APK
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "ERROR: GitHub Secret SUPABASE_PUBLISHABLE_KEY belum diisi."
            exit 1
          fi
          gradle :android-guru:app:assembleDebug \
            -PSUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UJIANKU-V1.0-A-debug
          path: android-guru/app/build/outputs/apk/debug/app-debug.apk
